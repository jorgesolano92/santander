<script>
document.addEventListener("DOMContentLoaded", function() {
    let offset = 0;
    const logType = "sip";
    const logContainer = document.getElementById("log-container");

    function loadLog() {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "load_log.php?log=" + logType + "&offset=" + offset, true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                logContainer.innerHTML += xhr.responseText;
                offset += 100; // Incrementar el offset para la próxima carga
            }
        };
        xhr.send();
    }

    loadLog(); // Cargar la primera parte del log

    logContainer.addEventListener("scroll", function() {
        if (logContainer.scrollTop + logContainer.clientHeight >= logContainer.scrollHeight) {
            loadLog(); // Cargar más contenido cuando se llega al final del contenedor
        }
    });
});
</script>
